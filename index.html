<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    font-family:'Cormorant Garamond',serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:4px;
}

.calendar{
    width:100%;
    max-width:290px;
    background:#f8f4f6;
    border:2px solid #efc6d8;
    border-radius:28px;
    padding:12px;
    box-shadow:
        0 0 25px rgba(239,198,216,.35),
        inset 0 0 0 6px rgba(255,240,245,.7);
}

.title{
    text-align:center;
    color:#b37b9b;
    font-size:0.9rem;
    margin-bottom:2px;
}

.month{
    text-align:center;
    color:#92677f;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:8px;
}

.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    padding-bottom:6px;
    border-bottom:1px dashed #e4bfd0;
    margin-bottom:6px;
}

.days div{
    font-size:0.7rem;
    font-weight:600;
    color:#b07a97;
}

.dates{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    width:100%;
    margin-top:8px;
}

.dates div{
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.8rem;
    color:#8b667b;
}

.today{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#e9b0ca;
    color:white !important;
    font-weight:600;
    margin:auto;
}

.footer{
    text-align:center;
    margin-top:8px;
    color:#bc95ab;
    font-size:0.65rem;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="calendar">
    <div class="title">‎ . ݁⋆ ۶ৎ ݁˖ . ݁ </div>

    <div class="month" id="monthYear"></div>

    <div class="days">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
    </div>

    <div class="dates" id="dates"></div>

    <div class="footer">
        ♡ what, like it's hard? ♡
    </div>
</div>

<script>
const current = new Date();

const year = current.getFullYear();
const month = current.getMonth();

document.getElementById("monthYear").textContent =
  current.toLocaleString("default", {
    month: "long",
    year: "numeric"
  });

const datesContainer = document.getElementById("dates");

const firstDay = new Date(year, month, 1).getDay();
const totalDays = new Date(year, month + 1, 0).getDate();

for(let i = 0; i < firstDay; i++){
  const blank = document.createElement("div");
  datesContainer.appendChild(blank);
}

for(let day = 1; day <= totalDays; day++){

  const date = document.createElement("div");

  date.textContent = day;

  if(day === current.getDate()){
    date.classList.add("today");
  }

  datesContainer.appendChild(date);
}
</script>

</body>
</html>
